---
- id: check-nginx-wide-range
  name: check wide `try_files` directive
  description: prevents from committing nginx configs with wide `try_files` directives
    without disabled locations
  entry: check-nginx-wide-range
  language: python
  stages:
    - pre-commit
    - pre-push
    - manual
  require_serial: true

- id: add-task-number
  name: add-task-number
  entry: add-task-number
  language: python
  description: pre-commit hook for adding issue task number to your git commit messages
  stages:
    - commit-msg

- id: jira-pre-commit
  name: Jira Task ID in the commit message
  description: Checks for Jira Task ID in the commit message
  entry: jira-pre-commit
  language: python
  stages:
    - commit-msg

- id: kyverno-test
  name: Kyverno test
  description: Runs and validates Kyverno policy tests
  entry: kyverno-test
  language: python
  always_run: true
  pass_filenames: false
  additional_dependencies:
    - PyYAML
  stages:
    - pre-commit
    - pre-push
    - manual
  require_serial: true

- id: check-placeholders
  name: Check for placeholder variables in code
  description: Checks for unreplaced placeholder variables, e.g. `$DOMAIN`, in code
  entry: check-placeholders
  language: python
  stages:
    - pre-commit
    - pre-push
